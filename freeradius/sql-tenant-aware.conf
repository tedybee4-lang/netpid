# ---------------------------------------------------------------------------
# NETPID — rlm_sql (PostgreSQL) module, tenant-aware. FreeRADIUS 3.0.x
# ---------------------------------------------------------------------------
# Install as /etc/freeradius/3.0/mods-available/sql, then:
#   ln -s ../mods-available/sql /etc/freeradius/3.0/mods-enabled/sql
#
# Two instances:
#   sql        -> role radius_auth : authorize + post-auth (read-mostly)
#   sql_acct   -> role radius_acct : accounting
# The NETPID worker writes authorization data using the radius_sync role.
#
# KEY RULE — no query may look a user up globally. Every query is scoped by
# netpid_resolve_isp(), which derives the tenant from the NAS-IP-Address attribute,
# the UDP source IP, and finally username ownership. An unresolvable packet gets
# NULL and is rejected; it is never resolved "into some ISP".
#
# `%{NAS-IP-Address}` expands to an empty string when a NAS does not send it, so
# the fallback happens in SQL: nullif('', '')::inet -> NULL.
#
# Syntax notes: alternation is %{%{Attr}:-default} (nested), continuation lines end
# with a backslash, and hex/octet counters are combined with (gigawords << 32).
# ---------------------------------------------------------------------------

sql {
    dialect = "postgresql"
    driver = "rlm_sql_postgresql"
    server = "127.0.0.1"
    port = 5432
    login = "radius_auth"
    password = "CHANGE_ME_RADIUS_AUTH"
    radius_db = "radius_db"

    # Clients come from the `nas` table, which the worker keeps in sync per tenant.
    read_clients = yes
    client_table = "nas"
    # Only enabled NAS rows may authenticate; a disabled router is rejected.
    client_query = "SELECT id, nasname, shortname, type, secret, server, community, description \
                    FROM nas WHERE enabled ORDER BY id"

    # 3.0.22+ only: abort packing when a NAS is missing Message-Authenticator.
    # Enable together with `require_message_authenticator = yes` per NAS row.
    # Message-Authenticator = Yes

    # --------------------------------------------------------------- authorize
    authorize_check_query = "\
        SELECT id, username, attribute, value, op FROM radcheck \
        WHERE username = netpid_bare_user('%{User-Name}') \
          AND isp_id = netpid_resolve_isp('%{Packet-Src-IP-Address}'::inet, '%{User-Name}', \
                                         nullif('%{NAS-IP-Address}', '')::inet) \
        ORDER BY id"

    authorize_reply_query = "\
        SELECT id, username, attribute, value, op FROM radreply \
        WHERE username = netpid_bare_user('%{User-Name}') \
          AND isp_id = netpid_resolve_isp('%{Packet-Src-IP-Address}'::inet, '%{User-Name}', \
                                         nullif('%{NAS-IP-Address}', '')::inet) \
        ORDER BY id"

    # Sql-Group is the quoted list produced by group_membership_query and is
    # expanded by rlm_sql in the two group queries below.
    group_membership_query = "\
        SELECT groupname FROM radusergroup \
        WHERE username = netpid_bare_user('%{User-Name}') \
          AND isp_id = netpid_resolve_isp('%{Packet-Src-IP-Address}'::inet, '%{User-Name}', \
                                         nullif('%{NAS-IP-Address}', '')::inet) \
        ORDER BY priority"

    # THE bandwidth path: radgroupreply -> Access-Accept -> MikroTik rate limit.
    # Without authorize_group_reply_query users authorize with no limits at all
    # (the classic "package not applied" bug).
    # Group rows are tenant-scoped too: the same groupname can exist for several
    # ISPs with different limits, so the packet's tenant must match.
    authorize_group_check_query = "\
        SELECT id, groupname, attribute, value, op FROM radgroupcheck \
        WHERE groupname IN (%{Sql-Group}) \
          AND isp_id = netpid_resolve_isp('%{Packet-Src-IP-Address}'::inet, '%{User-Name}', \
                                          nullif('%{NAS-IP-Address}', '')::inet) \
        ORDER BY id"

    authorize_group_reply_query = "\
        SELECT id, groupname, attribute, value, op FROM radgroupreply \
        WHERE groupname IN (%{Sql-Group}) \
          AND isp_id = netpid_resolve_isp('%{Packet-Src-IP-Address}'::inet, '%{User-Name}', \
                                          nullif('%{NAS-IP-Address}', '')::inet) \
        ORDER BY id"

    # Post-auth audit trail. The password is deliberately NOT stored (the column
    # exists for schema compatibility and stays empty). `post-auth { query }` is
    # the FreeRADIUS 3 spelling — the v2 flat `postauth_query` item is ignored.
    # NULL-tenant rows are kept on purpose: an unattributed attempt is still an
    # attempt worth auditing; it is never attributed to "some ISP".
    post-auth {
        query = "\
            INSERT INTO radpostauth (username, pass, reply, authdate, isp_id, nasipaddress) \
            VALUES (netpid_bare_user('%{User-Name}'), '', '%{reply:Packet-Type}', NOW(), \
                    netpid_resolve_isp('%{Packet-Src-IP-Address}'::inet, '%{User-Name}', \
                                       nullif('%{NAS-IP-Address}', '')::inet), \
                    coalesce(nullif('%{NAS-IP-Address}', ''), '%{Packet-Src-IP-Address}')::inet)"
    }
}

# ---------------------------------------------------------------------------
# Accounting instance (role radius_acct). Every row is tenant-stamped, so the app
# mirror and reports never guess an owner and a shared NAS IP cannot mix tenants.
# 64-bit counters: upstream stores (gigawords << 32) + octets in one column; the
# NETPID mirror understands both that layout and raw+gigawords layouts.
# ---------------------------------------------------------------------------
sql sql_acct {
    dialect = "postgresql"
    driver = "rlm_sql_postgresql"
    server = "127.0.0.1"
    port = 5432
    login = "radius_acct"
    password = "CHANGE_ME_RADIUS_ACCT"
    radius_db = "radius_db"

    # Each named instance must register its own group xlat — the default
    # "Sql-Group" name belongs to the unnamed `sql` instance above (see
    # mods-available/sql, "multiple instances"). Accounting queries never use it;
    # the unique name only prevents a duplicate-xlat collision at instantiate.
    group_attribute = "${.:instance}-SQL-Group"

    # rlm_sql picks the query below by Acct-Status-Type through this reference —
    # the stock FreeRADIUS 3 pattern. The flat v2 items (accounting_start_query &
    # friends) are NOT read by rlm_sql 3.x and would be silently ignored. When
    # Acct-Status-Type is absent the request-processing stage ("accounting") is
    # used, which lands on the `accounting` catch-all block at the end of `type`.
    accounting {
        reference = "%{tolower:type.%{%{Acct-Status-Type}:-%{Request-Processing-Stage}}.query}"

        type {
            # Acct-Status-Type = Start (a re-sent Start updates the same row).
            # Tenant gate: when netpid_resolve_isp() returns NULL the SELECT has
            # no row and nothing is written — never "some tenant".
            start {
                query = "\
                    WITH pkt AS ( \
                        SELECT netpid_resolve_isp('%{Packet-Src-IP-Address}'::inet, '%{User-Name}', \
                                                  nullif('%{NAS-IP-Address}', '')::inet) AS isp_id) \
                    INSERT INTO radacct \
                      (acctsessionid, acctuniqueid, username, realm, nasipaddress, nasportid, \
                       nasporttype, acctstarttime, acctupdatetime, acctinterval, acctsessiontime, \
                       acctauthentic, connectinfo_start, acctinputoctets, acctoutputoctets, \
                       acctinputgigawords, acctoutputgigawords, calledstationid, callingstationid, \
                       servicetype, framedprotocol, framedipaddress, isp_id) \
                    SELECT '%{Acct-Session-Id}', '%{Acct-Unique-Session-Id}', \
                           netpid_bare_user('%{User-Name}'), '%{Realm}', \
                           coalesce(nullif('%{NAS-IP-Address}', ''), '%{Packet-Src-IP-Address}')::inet, \
                           '%{NAS-Port}', '%{NAS-Port-Type}', \
                           TO_TIMESTAMP('%{%{Event-Timestamp}:-0}'::bigint), \
                           TO_TIMESTAMP('%{%{Event-Timestamp}:-0}'::bigint), \
                           '%{%{Acct-Interval}:-0}'::integer, '%{%{Acct-Session-Time}:-0}'::integer, \
                           '%{Acct-Authentic}', '%{Connect-Info}', \
                           (('%{%{Acct-Input-Gigawords}:-0}'::bigint << 32) + '%{%{Acct-Input-Octets}:-0}'::bigint), \
                           (('%{%{Acct-Output-Gigawords}:-0}'::bigint << 32) + '%{%{Acct-Output-Octets}:-0}'::bigint), \
                           0, 0, \
                           '%{Called-Station-Id}', '%{Calling-Station-Id}', \
                           '%{Service-Type}', '%{Framed-Protocol}', \
                           nullif('%{Framed-IP-Address}', '')::inet, \
                           pkt.isp_id \
                    FROM pkt WHERE pkt.isp_id IS NOT NULL \
                    ON CONFLICT (isp_id, acctuniqueid) DO UPDATE SET \
                      acctsessionid = EXCLUDED.acctsessionid, \
                      acctstarttime = EXCLUDED.acctstarttime, \
                      acctupdatetime = EXCLUDED.acctupdatetime, \
                      framedipaddress = EXCLUDED.framedipaddress, \
                      acctstoptime = NULL"
            }

            # Acct-Status-Type = Interim-Update: the usage the dashboards show.
            # rlm_sql tries the queries in order until one affects a row, so the
            # INSERT below only runs when the UPDATE found no open session
            # (Start packet lost) — a closed row is never resurrected because of
            # ON CONFLICT DO NOTHING.
            interim-update {
                query = "\
                    UPDATE radacct SET \
                      framedipaddress = nullif('%{Framed-IP-Address}', '')::inet, \
                      acctsessiontime = '%{%{Acct-Session-Time}:-0}'::integer, \
                      acctinputoctets = (('%{%{Acct-Input-Gigawords}:-0}'::bigint << 32) + '%{%{Acct-Input-Octets}:-0}'::bigint), \
                      acctoutputoctets = (('%{%{Acct-Output-Gigawords}:-0}'::bigint << 32) + '%{%{Acct-Output-Octets}:-0}'::bigint), \
                      acctinputgigawords = 0, \
                      acctoutputgigawords = 0, \
                      acctupdatetime = TO_TIMESTAMP('%{%{Event-Timestamp}:-0}'::bigint), \
                      acctinterval = '%{%{Acct-Interval}:-0}'::integer \
                    WHERE acctuniqueid = '%{Acct-Unique-Session-Id}' \
                      AND acctstoptime IS NULL \
                      AND isp_id = netpid_resolve_isp('%{Packet-Src-IP-Address}'::inet, '%{User-Name}', \
                                                      nullif('%{NAS-IP-Address}', '')::inet)"

                # Lost Start: materialize the open session from the interim
                # counters. A stray interim for an already-closed session hits
                # the unique key and does nothing.
                query = "\
                    WITH pkt AS ( \
                        SELECT netpid_resolve_isp('%{Packet-Src-IP-Address}'::inet, '%{User-Name}', \
                                                  nullif('%{NAS-IP-Address}', '')::inet) AS isp_id) \
                    INSERT INTO radacct \
                      (acctsessionid, acctuniqueid, username, realm, nasipaddress, nasportid, \
                       nasporttype, acctstarttime, acctupdatetime, acctinterval, acctsessiontime, \
                       acctauthentic, connectinfo_start, acctinputoctets, acctoutputoctets, \
                       acctinputgigawords, acctoutputgigawords, calledstationid, callingstationid, \
                       servicetype, framedprotocol, framedipaddress, isp_id) \
                    SELECT '%{Acct-Session-Id}', '%{Acct-Unique-Session-Id}', \
                           netpid_bare_user('%{User-Name}'), '%{Realm}', \
                           coalesce(nullif('%{NAS-IP-Address}', ''), '%{Packet-Src-IP-Address}')::inet, \
                           '%{NAS-Port}', '%{NAS-Port-Type}', \
                           TO_TIMESTAMP('%{%{Event-Timestamp}:-0}'::bigint), \
                           TO_TIMESTAMP('%{%{Event-Timestamp}:-0}'::bigint), \
                           '%{%{Acct-Interval}:-0}'::integer, '%{%{Acct-Session-Time}:-0}'::integer, \
                           '%{Acct-Authentic}', '%{Connect-Info}', \
                           (('%{%{Acct-Input-Gigawords}:-0}'::bigint << 32) + '%{%{Acct-Input-Octets}:-0}'::bigint), \
                           (('%{%{Acct-Output-Gigawords}:-0}'::bigint << 32) + '%{%{Acct-Output-Octets}:-0}'::bigint), \
                           0, 0, \
                           '%{Called-Station-Id}', '%{Calling-Station-Id}', \
                           '%{Service-Type}', '%{Framed-Protocol}', \
                           nullif('%{Framed-IP-Address}', '')::inet, \
                           pkt.isp_id \
                    FROM pkt WHERE pkt.isp_id IS NOT NULL \
                    ON CONFLICT (isp_id, acctuniqueid) DO NOTHING"
            }

            # Acct-Status-Type = Stop: close the session with final counters.
            # The INSERT runs only when the UPDATE hit no row (Start was lost
            # entirely), so usage from a Stop-only session is never dropped.
            stop {
                query = "\
                    UPDATE radacct SET \
                      acctstoptime = TO_TIMESTAMP('%{%{Event-Timestamp}:-0}'::bigint), \
                      acctupdatetime = TO_TIMESTAMP('%{%{Event-Timestamp}:-0}'::bigint), \
                      acctsessiontime = '%{%{Acct-Session-Time}:-0}'::integer, \
                      acctinputoctets = (('%{%{Acct-Input-Gigawords}:-0}'::bigint << 32) + '%{%{Acct-Input-Octets}:-0}'::bigint), \
                      acctoutputoctets = (('%{%{Acct-Output-Gigawords}:-0}'::bigint << 32) + '%{%{Acct-Output-Octets}:-0}'::bigint), \
                      acctinputgigawords = 0, \
                      acctoutputgigawords = 0, \
                      acctterminatecause = '%{Acct-Terminate-Cause}', \
                      connectinfo_stop = '%{Connect-Info}', \
                      framedipaddress = nullif('%{Framed-IP-Address}', '')::inet \
                    WHERE acctuniqueid = '%{Acct-Unique-Session-Id}' \
                      AND acctstoptime IS NULL \
                      AND isp_id = netpid_resolve_isp('%{Packet-Src-IP-Address}'::inet, '%{User-Name}', \
                                                      nullif('%{NAS-IP-Address}', '')::inet)"

                query = "\
                    WITH pkt AS ( \
                        SELECT netpid_resolve_isp('%{Packet-Src-IP-Address}'::inet, '%{User-Name}', \
                                                  nullif('%{NAS-IP-Address}', '')::inet) AS isp_id) \
                    INSERT INTO radacct \
                      (acctsessionid, acctuniqueid, username, realm, nasipaddress, nasportid, \
                       nasporttype, acctstarttime, acctupdatetime, acctstoptime, acctsessiontime, \
                       acctauthentic, connectinfo_start, connectinfo_stop, \
                       acctinputoctets, acctoutputoctets, acctinputgigawords, acctoutputgigawords, \
                       calledstationid, callingstationid, acctterminatecause, servicetype, \
                       framedprotocol, framedipaddress, isp_id) \
                    SELECT '%{Acct-Session-Id}', '%{Acct-Unique-Session-Id}', \
                           netpid_bare_user('%{User-Name}'), '%{Realm}', \
                           coalesce(nullif('%{NAS-IP-Address}', ''), '%{Packet-Src-IP-Address}')::inet, \
                           '%{NAS-Port}', '%{NAS-Port-Type}', \
                           TO_TIMESTAMP('%{%{Event-Timestamp}:-0}'::bigint - %{%{Acct-Session-Time}:-0}), \
                           TO_TIMESTAMP('%{%{Event-Timestamp}:-0}'::bigint), \
                           TO_TIMESTAMP('%{%{Event-Timestamp}:-0}'::bigint), \
                           '%{%{Acct-Session-Time}:-0}'::integer, \
                           '%{Acct-Authentic}', '', '%{Connect-Info}', \
                           (('%{%{Acct-Input-Gigawords}:-0}'::bigint << 32) + '%{%{Acct-Input-Octets}:-0}'::bigint), \
                           (('%{%{Acct-Output-Gigawords}:-0}'::bigint << 32) + '%{%{Acct-Output-Octets}:-0}'::bigint), \
                           0, 0, \
                           '%{Called-Station-Id}', '%{Calling-Station-Id}', '%{Acct-Terminate-Cause}', \
                           '%{Service-Type}', '%{Framed-Protocol}', \
                           nullif('%{Framed-IP-Address}', '')::inet, \
                           pkt.isp_id \
                    FROM pkt WHERE pkt.isp_id IS NOT NULL \
                    ON CONFLICT (isp_id, acctuniqueid) DO NOTHING"
            }

            # Accounting-On / Accounting-Off: the NAS is rebooting or powering
            # down — bulk-close everything still open on that NAS (tenant- and
            # address-scoped, same semantics as stock FreeRADIUS).
            accounting-on {
                query = "\
                    UPDATE radacct SET \
                      acctstoptime = TO_TIMESTAMP('%{%{Event-Timestamp}:-0}'::bigint), \
                      acctupdatetime = TO_TIMESTAMP('%{%{Event-Timestamp}:-0}'::bigint), \
                      acctsessiontime = GREATEST(0, ('%{%{Event-Timestamp}:-0}'::bigint \
                          - EXTRACT(EPOCH FROM acctstarttime)))::integer, \
                      acctterminatecause = 'NAS-Reboot' \
                    WHERE acctstoptime IS NULL \
                      AND isp_id = netpid_resolve_isp('%{Packet-Src-IP-Address}'::inet, '%{User-Name}', \
                                                      nullif('%{NAS-IP-Address}', '')::inet) \
                      AND nasipaddress = coalesce(nullif('%{NAS-IP-Address}', ''), \
                                                  '%{Packet-Src-IP-Address}')::inet"
            }

            accounting-off {
                query = "\
                    UPDATE radacct SET \
                      acctstoptime = TO_TIMESTAMP('%{%{Event-Timestamp}:-0}'::bigint), \
                      acctupdatetime = TO_TIMESTAMP('%{%{Event-Timestamp}:-0}'::bigint), \
                      acctsessiontime = GREATEST(0, ('%{%{Event-Timestamp}:-0}'::bigint \
                          - EXTRACT(EPOCH FROM acctstarttime)))::integer, \
                      acctterminatecause = 'NAS-Reboot' \
                    WHERE acctstoptime IS NULL \
                      AND isp_id = netpid_resolve_isp('%{Packet-Src-IP-Address}'::inet, '%{User-Name}', \
                                                      nullif('%{NAS-IP-Address}', '')::inet) \
                      AND nasipaddress = coalesce(nullif('%{NAS-IP-Address}', ''), \
                                                  '%{Packet-Src-IP-Address}')::inet"
            }

            # No Acct-Status-Type == ignore the packet (stock fallback: without a
            # status type the reference falls back to the request-processing
            # stage, which is "accounting" for Accounting-Requests).
            accounting {
                query = "SELECT true"
            }
        }
    }
}
